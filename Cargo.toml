[package]
name = "chdb-rust"
version = "1.3.1"
edition = "2021"
authors = ["Auxten"]
description = "chDB FFI bindings for Rust(Experimental)"
homepage = "https://github.com/chdb-io/chdb-rust"
repository = "https://github.com/chdb-io/chdb-rust"
license = "Apache-2.0"
readme = "README.md"
keywords = ["clickhouse", "chdb", "database", "embedded", "analytics"]

[dependencies]
thiserror = "1"
arrow = { version = "55", optional = true, default-features = false, features = ["ffi"] }

[features]
# By default, we link dynamically.
# Users can opt-in to static linking with --features static
static = []
# Enables Arrow C Data Interface query streaming (`Connection::query_stream_arrow`).
arrow = ["dep:arrow"]

[build-dependencies]
bindgen = "0.70.1"
reqwest = { version = "0.11", features = ["blocking"] }
flate2 = "1.0"
tar = "0.4"

[dev-dependencies]
arrow = { version = "55", default-features = false, features = ["ffi", "ipc", "prettyprint"] }
tempdir = "0.3.7"

[[example]]
name = "10_arrow_query_stream"
required-features = ["arrow"]

[package.metadata.docs.rs]
# docs.rs cannot download libchdb or link native libraries.
# Setting DOCS_RS env var tells build.rs to skip native build steps.
rustc-args = ["--cfg", "docsrs"]
